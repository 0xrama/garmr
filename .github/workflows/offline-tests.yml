name: Offline artifact validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: |
          sh -n poc/trustlet_patch/common.sh
          sh -n poc/trustlet_patch/post-fs-data.sh
          sh -n poc/trustlet_patch/service.sh
